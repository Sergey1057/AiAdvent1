# После push в main (app/**) — обновление REDME.md и docs/ (self-contained, без llm_agent на GitHub).
# Секреты: GROQ_API_KEY или GIGACHAT_API_KEY (как ai-pr-review).
# Нужны: .github/file-assistant/ и .github/ai-review/gigachat_client.py

name: AI Docs Sync

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
  workflow_dispatch:

concurrency:
  group: ai-docs-sync-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-docs:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, '[skip docs]') &&
        !contains(github.event.head_commit.message, 'docs: AI sync')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify docs-sync bundle
        run: |
          test -f .github/file-assistant/sync_docs.py || {
            echo "::error::Скопируйте deploy/ai-advent1/file-assistant/ в .github/file-assistant/"
            exit 1
          }
          test -f .github/ai-review/gigachat_client.py || {
            echo "::error::Нужен .github/ai-review/gigachat_client.py (из deploy/ai-advent1/ai-review/)"
            exit 1
          }

      - name: Configure LLM API key
        env:
          GIGACHAT_KEY: ${{ secrets.GIGACHAT_API_KEY }}
          GIGACHAT_ALT1: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GIGACHAT_ALT2: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -e
          GIGA=""
          if [ -n "$GIGACHAT_KEY" ]; then GIGA="$GIGACHAT_KEY"; fi
          if [ -z "$GIGA" ] && [ -n "$GIGACHAT_ALT1" ]; then GIGA="$GIGACHAT_ALT1"; fi
          if [ -z "$GIGA" ] && [ -n "$GIGACHAT_ALT2" ]; then GIGA="$GIGACHAT_ALT2"; fi

          if [ -n "$GIGA" ]; then
            echo "GIGACHAT_API_KEY=$GIGA" >> "$GITHUB_ENV"
            echo "DOCS_SYNC_LLM=gigachat" >> "$GITHUB_ENV"
            echo "LLM: GigaChat"
          elif [ -n "$GROQ_KEY" ]; then
            echo "GROQ_API_KEY=$GROQ_KEY" >> "$GITHUB_ENV"
            echo "DOCS_SYNC_LLM=groq" >> "$GITHUB_ENV"
            echo "LLM: Groq"
          else
            echo "::error::Добавьте GIGACHAT_API_KEY или GROQ_API_KEY в Secrets"
            exit 1
          fi

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r .github/file-assistant/requirements.txt

      - name: Run docs sync
        env:
          DOCS_SYNC_PROJECT_ROOT: ${{ github.workspace }}
          DOCS_SYNC_COMMIT_MSG: ${{ github.event.head_commit.message }}
          DOCS_SYNC_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat' }}
          GIGACHAT_SCOPE: ${{ vars.GIGACHAT_SCOPE || 'GIGACHAT_API_PERS' }}
          DOCS_SYNC_MODEL: ${{ vars.DOCS_SYNC_MODEL || vars.PR_REVIEW_MODEL || 'llama-3.3-70b-versatile' }}
        run: python .github/file-assistant/sync_docs.py

      - name: Commit and push doc updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REDME.md docs/ || true
          if git diff --staged --quiet; then
            echo "Нет изменений в REDME.md / docs/"
            exit 0
          fi
          git commit -m "docs: AI sync после мержа [skip docs]"
          git push
