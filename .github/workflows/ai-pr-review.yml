# Self-contained AI PR review — .github/ai-review/
# Secret: GIGACHAT_API_KEY (Settings → Secrets → Actions)

name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6

      - name: Verify review bundle
        run: |
          test -f .github/ai-review/review_pr.py || {
            echo "::error::Нет .github/ai-review/review_pr.py — добавьте папку ai-review в репозиторий"
            exit 1
          }
          test -f .github/ai-review/prompt.txt
          ls -la .github/ai-review/

      - name: Check GIGACHAT_API_KEY secret
        env:
          GIGA_KEY: ${{ secrets.GIGACHAT_API_KEY }}
        run: |
          if [ -z "$GIGA_KEY" ]; then
            echo "::error::Secret GIGACHAT_API_KEY не задан. Repository → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "GIGACHAT_API_KEY: задан (${#GIGA_KEY} символов)"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r .github/ai-review/requirements.txt

      - name: Run AI code review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIGACHAT_API_KEY: ${{ secrets.GIGACHAT_API_KEY }}
          GIGACHAT_MODEL: ${{ vars.PR_REVIEW_MODEL || vars.GIGACHAT_MODEL || 'GigaChat' }}
          GIGACHAT_SCOPE: ${{ vars.GIGACHAT_SCOPE || 'GIGACHAT_API_PERS' }}
          PR_REVIEW_LLM: gigachat
        run: python .github/ai-review/review_pr.py
